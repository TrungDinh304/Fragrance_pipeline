name: perfume-intel

# Cấu hình dùng chung. Chỉ `scheduler` chạy nền; hai service còn lại nằm trong
# profile `cli` nên `docker compose up` không đụng tới chúng.
x-app: &app
  build:
    context: .
  image: perfume-intel:0.2.0
  working_dir: /app
  volumes:
    # BIND MOUNT, không phải named volume: trên máy này đã có sẵn sổ theo dõi và
    # dữ liệu đã crawl trong ./data. Dùng named volume là container chạy trên
    # một bản trống rồi crawl lại từ đầu, còn dữ liệu cũ thì host vẫn thấy mà
    # container không.
    - ./data:/app/data
    # Cache HTML thô. Có trần dung lượng do config.CACHE_MAX_BYTES lo, không
    # phải Docker — để ngoài data/ vì không phải dữ liệu thu được.
    - ./.cache:/app/.cache
  # /dev/shm mặc định của Docker là 64 MB. Chrome dùng shm cho bộ nhớ render và
  # sẽ chết giữa trang ("Target closed") trên các trang nặng như Fragrantica.
  shm_size: 1gb

# Biến môi trường để code nói chuyện với lake. Gom riêng vì cả 4 service dùng
# chung, và vì đây là chỗ duy nhất quyết định bronze nằm ở đâu.
x-lake-env: &lake-env
  LAKE: ${LAKE:-s3}
  # Tên service, không phải localhost: trong mạng của compose thì `minio` phân
  # giải được, còn `localhost` là chính container đang gọi.
  #
  # TÊN BIẾN LÀ `COMPOSE_S3_ENDPOINT`, CỐ Ý KHÔNG PHẢI `S3_ENDPOINT`.
  # Dùng `${S3_ENDPOINT:-...}` thì biến của shell host rò thẳng vào container —
  # mà để chạy CLI ngoài Docker thì trên host phải đặt
  # `S3_ENDPOINT=http://localhost:9000`, và địa chỉ đó trong container trỏ vào
  # chính nó. Đã dính thật: container báo "Could not connect to the endpoint URL
  # http://localhost:9000". Cùng một kho, hai địa chỉ khác nhau, nên phải là hai
  # tên biến khác nhau. Trỏ sang S3 thật thì đặt COMPOSE_S3_ENDPOINT.
  S3_ENDPOINT: ${COMPOSE_S3_ENDPOINT:-http://minio:9000}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-perfume}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-perfume-dev-only}
  BRONZE_BUCKET: ${BRONZE_BUCKET:-bronze}
  SILVER_BUCKET: ${SILVER_BUCKET:-silver}

services:
  # --- data lake ---------------------------------------------------------------
  # MinIO nói đúng API S3, nên `core/objects.py` không có một dòng nào riêng cho
  # nó: đổi sang AWS S3 / R2 / Wasabi chỉ là đổi S3_ENDPOINT và khoá.
  #
  # VỀ CÁI TÊN IMAGE: `minio/minio` trên Docker Hub đã không còn pull được
  # (Hub API trả "object not found"), và `quay.io/minio/minio` đòi đăng nhập.
  # `bitnamilegacy/minio` là bản Bitnami đóng gói, pin theo digest nên tái lập
  # được. Pin bằng digest chứ không bằng `latest`: một repo đã đóng băng thì
  # `latest` có thể bị gỡ hoặc trỏ đi đâu khác, và lúc đó kho dữ liệu chính thức
  # của project không bật lên được.
  minio:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    container_name: perfume-intel-minio
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-perfume}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-perfume-dev-only}
      # Tạo sẵn hai bucket. Hai cái RIÊNG chứ không phải hai prefix: bronze là
      # tầng duy nhất không dựng lại được (phải crawl lại nhiều ngày) nên nó cần
      # chính sách khác silver — xem service `minio-init`.
      MINIO_DEFAULT_BUCKETS: ${BRONZE_BUCKET:-bronze},${SILVER_BUCKET:-silver}
    ports:
      # 9000 = API S3; 9001 = giao diện web để xem bằng mắt.
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      # Named volume, KHÔNG bind mount: đây là định dạng nội bộ của MinIO, không
      # phải file để người dùng mở. Trên Windows, bind mount đi qua WSL2 còn gây
      # lỗi quyền với user 1001 trong image.
      #
      # Sao lưu KHÔNG phải copy volume này: chạy `cli lake pull` là có lại toàn
      # bộ bronze dưới dạng .jsonl trong ./data/raw — đúng thứ vẫn đang sao lưu.
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # --- bật versioning cho bronze, chạy một lượt rồi thoát ----------------------
  # `mc` nằm sẵn trong image MinIO nên không cần image thứ hai.
  #
  # Versioning CHỈ cho bronze, và đó là cả lý do tách hai bucket: một lần ghi đè
  # nhầm bằng file ngắn hơn vẫn lấy lại được bản cũ. Silver thì `make silver`
  # dựng lại trong vài giây, bật versioning chỉ để tốn chỗ.
  minio-init:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        mc alias set lake http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "lake/$$BRONZE_BUCKET" "lake/$$SILVER_BUCKET"
        mc version enable "lake/$$BRONZE_BUCKET"
        echo "--- bucket da san sang ---"
        mc ls lake
        mc version info "lake/$$BRONZE_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-perfume}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-perfume-dev-only}
      BRONZE_BUCKET: ${BRONZE_BUCKET:-bronze}
      SILVER_BUCKET: ${SILVER_BUCKET:-silver}
    restart: "no"
  # --- chạy nền: nhỏ giọt mỗi ngày --------------------------------------------
  scheduler:
    <<: *app
    container_name: perfume-intel-scheduler
    entrypoint: ["bash", "scripts/docker/scheduler.sh"]
    restart: unless-stopped
    # Script tự thoát khi nhận SIGTERM nên không cần chờ lâu; nhưng nếu đang
    # giữa một lượt crawl thì cho nó ít giây để đóng browser cho gọn.
    stop_grace_period: 30s
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *lake-env
      # Giờ trong container phải là giờ bạn nghĩ, không thì "02:30" là 02:30 UTC
      # tức 09:30 sáng ở VN — giờ máy đang được dùng.
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      RUN_AT: ${RUN_AT:-02:30}
      # 1 = chạy một lượt ngay khi container bật, để kiểm chứng luôn thay vì
      # chờ tới hôm sau mới biết có hoạt động không.
      RUN_ON_START: ${RUN_ON_START:-0}
      RENDER: ${RENDER:-1}
      BUDGET: ${BUDGET:-}
      BRANDS: ${BRANDS:-}
      DELAY: ${DELAY:-}

  # --- chạy tay một lệnh bất kỳ -----------------------------------------------
  #   docker compose run --rm cli queue
  #   docker compose run --rm cli daily --render --budget 20
  #   docker compose run --rm cli analyze
  cli:
    <<: *app
    profiles: ["cli"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *lake-env
      TZ: ${TZ:-Asia/Ho_Chi_Minh}

  # --- dựng bảng gold bằng dbt ------------------------------------------------
  #   docker compose run --rm marts            (mặc định: build = chạy + test)
  #   docker compose run --rm marts run        (chỉ dựng, bỏ test)
  #   docker compose run --rm marts test
  # Cần `silver` chạy trước, vì dbt đọc Parquet chứ không đọc JSONL thô.
  marts:
    <<: *app
    profiles: ["cli"]
    working_dir: /app/transform
    entrypoint: ["python", "-m", "dbt.cli.main"]
    command: ["build"]
    environment:
      # dbt đọc YAML bằng encoding mặc định của hệ điều hành; thiếu dòng này thì
      # nó chết ngay ở dòng tiếng Việt đầu tiên trong dbt_project.yml.
      PYTHONUTF8: "1"
      DBT_PROFILES_DIR: "."
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # dbt đọc Parquet trong ./data/silver (cache local), không đọc S3. Vẫn khai
      # biến lake để `silver` chạy trong service này kéo được bản mới về.
      <<: *lake-env

  # --- toàn bộ test, không cần mạng -------------------------------------------
  #   docker compose run --rm test
  test:
    <<: *app
    profiles: ["cli"]
    entrypoint: ["make"]
    command: ["test"]
    # Test chạy trên fixture đã đóng vào ảnh; không cho nó thấy dữ liệu thật để
    # một bài test viết sai đường dẫn không thể làm hỏng sổ theo dõi.
    volumes: []
    environment:
      # LAKE=off có chủ đích, và KHÔNG kế thừa *lake-env: một bài test viết sai
      # đường dẫn không được phép ghi vào kho dữ liệu chính thức. Phần hợp đồng
      # S3 tự bỏ qua khi không thấy S3_ENDPOINT.
      LAKE: "off"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}

volumes:
  # Dữ liệu nội bộ của MinIO. Không sửa tay; muốn xem dữ liệu thì mở console ở
  # http://localhost:9001, muốn lấy ra thì `docker compose run --rm cli lake pull`.
  minio-data:
