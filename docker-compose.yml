name: perfume-intel

# Cấu hình dùng chung. Chỉ `scheduler` chạy nền; hai service còn lại nằm trong
# profile `cli` nên `docker compose up` không đụng tới chúng.
x-app: &app
  build:
    context: .
  image: perfume-intel:0.2.0
  working_dir: /app
  volumes:
    # BIND MOUNT, không phải named volume: trên máy này đã có sẵn sổ theo dõi và
    # dữ liệu đã crawl trong ./data. Dùng named volume là container chạy trên
    # một bản trống rồi crawl lại từ đầu, còn dữ liệu cũ thì host vẫn thấy mà
    # container không.
    - ./data:/app/data
    # Cache HTML thô. Có trần dung lượng do config.CACHE_MAX_BYTES lo, không
    # phải Docker — để ngoài data/ vì không phải dữ liệu thu được.
    - ./.cache:/app/.cache
  # /dev/shm mặc định của Docker là 64 MB. Chrome dùng shm cho bộ nhớ render và
  # sẽ chết giữa trang ("Target closed") trên các trang nặng như Fragrantica.
  shm_size: 1gb

# Biến môi trường để code nói chuyện với lake. Gom riêng vì cả 4 service dùng
# chung, và vì đây là chỗ duy nhất quyết định bronze nằm ở đâu.
x-lake-env: &lake-env
  LAKE: ${LAKE:-s3}
  # Tên service, không phải localhost: trong mạng của compose thì `minio` phân
  # giải được, còn `localhost` là chính container đang gọi.
  #
  # TÊN BIẾN LÀ `COMPOSE_S3_ENDPOINT`, CỐ Ý KHÔNG PHẢI `S3_ENDPOINT`.
  # Dùng `${S3_ENDPOINT:-...}` thì biến của shell host rò thẳng vào container —
  # mà để chạy CLI ngoài Docker thì trên host phải đặt
  # `S3_ENDPOINT=http://localhost:9000`, và địa chỉ đó trong container trỏ vào
  # chính nó. Đã dính thật: container báo "Could not connect to the endpoint URL
  # http://localhost:9000". Cùng một kho, hai địa chỉ khác nhau, nên phải là hai
  # tên biến khác nhau. Trỏ sang S3 thật thì đặt COMPOSE_S3_ENDPOINT.
  S3_ENDPOINT: ${COMPOSE_S3_ENDPOINT:-http://minio:9000}
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-perfume}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-perfume-dev-only}
  BRONZE_BUCKET: ${BRONZE_BUCKET:-bronze}
  SILVER_BUCKET: ${SILVER_BUCKET:-silver}

# Kho vector + cổng gọi LLM. Tách khối riêng vì chỉ `api` và `cli` cần.
x-ai-env: &ai-env
  PG_DSN: postgresql://${PG_USER:-perfume}:${PG_PASSWORD:-perfume-dev-only}@postgres:5432/${PG_DB:-perfume}
  EMBED_MODEL: ${EMBED_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
  # 9router chạy trên MÁY HOST, không trong mạng compose. `host.docker.internal`
  # là cách container gọi ra host trên Docker Desktop.
  #
  # TÊN BIẾN LÀ `COMPOSE_LLM_BASE_URL`, cố ý không phải `LLM_BASE_URL` — y hệt lý
  # do với S3_ENDPOINT: trên host thì endpoint là http://localhost:20128/v1, còn
  # trong container `localhost` trỏ vào chính container. Một kho, hai địa chỉ, nên
  # phải là hai tên biến.
  LLM_BASE_URL: ${COMPOSE_LLM_BASE_URL:-http://host.docker.internal:20128/v1}
  LLM_MODEL: ${LLM_MODEL:-kr/claude-haiku-4.5}
  LLM_API_KEY: ${LLM_API_KEY:-}

# Airflow. Dùng LocalExecutor nên KHÔNG cần redis/celery/worker/flower — bản
# compose mẫu trên trang Airflow có chúng vì nó dựng sẵn cho CeleryExecutor.
#
# Metadata nằm trong CHÍNH Postgres đang có, ở một database riêng (`airflow`).
# Dựng Postgres thứ hai chỉ để chứa bảng của Airflow là thêm một thứ phải sao lưu
# và phải nâng cấp, đổi lấy không gì cả.
# Airflow. MỘT container, chạy `airflow standalone` — trên Airflow 3 standalone
# bật đúng bốn thành phần mà bản compose mẫu trên trang Airflow tách rời
# (api-server, scheduler, dag-processor, triggerer). Gộp lại không mất gì và bớt
# khoảng 1 GB RAM.
#
# Ảnh build từ scripts/airflow/, theo mẫu dùng chung của các project khác. Khác
# một điểm: KHÔNG dựng venv phụ thuộc project trong ảnh này — xem lý do trong
# scripts/airflow/Dockerfile.
#
# Metadata nằm trong CHÍNH Postgres đang có, ở database riêng (`airflow`). Dựng
# Postgres thứ hai chỉ để chứa bảng của Airflow là thêm một thứ phải sao lưu và
# phải nâng cấp, đổi lấy không gì cả.

services:
  # --- data lake ---------------------------------------------------------------
  # MinIO nói đúng API S3, nên `core/objects.py` không có một dòng nào riêng cho
  # nó: đổi sang AWS S3 / R2 / Wasabi chỉ là đổi S3_ENDPOINT và khoá.
  #
  # VỀ CÁI TÊN IMAGE: `minio/minio` trên Docker Hub đã không còn pull được
  # (Hub API trả "object not found"), và `quay.io/minio/minio` đòi đăng nhập.
  # `bitnamilegacy/minio` là bản Bitnami đóng gói, pin theo digest nên tái lập
  # được. Pin bằng digest chứ không bằng `latest`: một repo đã đóng băng thì
  # `latest` có thể bị gỡ hoặc trỏ đi đâu khác, và lúc đó kho dữ liệu chính thức
  # của project không bật lên được.
  minio:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    container_name: perfume-intel-minio
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-perfume}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-perfume-dev-only}
      # Tạo sẵn hai bucket. Hai cái RIÊNG chứ không phải hai prefix: bronze là
      # tầng duy nhất không dựng lại được (phải crawl lại nhiều ngày) nên nó cần
      # chính sách khác silver — xem service `minio-init`.
      MINIO_DEFAULT_BUCKETS: ${BRONZE_BUCKET:-bronze},${SILVER_BUCKET:-silver}
    ports:
      # 9000 = API S3; 9001 = giao diện web để xem bằng mắt.
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      # Named volume, KHÔNG bind mount: đây là định dạng nội bộ của MinIO, không
      # phải file để người dùng mở. Trên Windows, bind mount đi qua WSL2 còn gây
      # lỗi quyền với user 1001 trong image.
      #
      # Sao lưu KHÔNG phải copy volume này: chạy `cli lake pull` là có lại toàn
      # bộ bronze dưới dạng .jsonl trong ./data/raw — đúng thứ vẫn đang sao lưu.
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # --- bật versioning cho bronze, chạy một lượt rồi thoát ----------------------
  # `mc` nằm sẵn trong image MinIO nên không cần image thứ hai.
  #
  # Versioning CHỈ cho bronze, và đó là cả lý do tách hai bucket: một lần ghi đè
  # nhầm bằng file ngắn hơn vẫn lấy lại được bản cũ. Silver thì `make silver`
  # dựng lại trong vài giây, bật versioning chỉ để tốn chỗ.
  minio-init:
    image: bitnamilegacy/minio@sha256:451fe6858cb770cc9d0e77ba811ce287420f781c7c1b806a386f6896471a349c
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        mc alias set lake http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "lake/$$BRONZE_BUCKET" "lake/$$SILVER_BUCKET"
        mc version enable "lake/$$BRONZE_BUCKET"
        echo "--- bucket da san sang ---"
        mc ls lake
        mc version info "lake/$$BRONZE_BUCKET"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-perfume}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-perfume-dev-only}
      BRONZE_BUCKET: ${BRONZE_BUCKET:-bronze}
      SILVER_BUCKET: ${SILVER_BUCKET:-silver}
    restart: "no"

  # --- kho vector -------------------------------------------------------------
  # Postgres + pgvector. Ghim theo digest, cùng lý do như ảnh MinIO.
  #
  # Đây là kho PHỤC VỤ, không phải nguồn sự thật: nó chỉ NẠP từ
  # data/silver/perfume_embeddings.parquet. Nên dùng named volume là đủ — xoá đi
  # nạp lại bằng `cli vectordb load` trong vài giây.
  postgres:
    image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    container_name: perfume-intel-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      POSTGRES_USER: ${PG_USER:-perfume}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-perfume-dev-only}
      POSTGRES_DB: ${PG_DB:-perfume}
    ports:
      - "${PG_PORT:-5433}:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-perfume} -d ${PG_DB:-perfume}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  # --- chạy nền: nhỏ giọt mỗi ngày --------------------------------------------
  # GIỮ LẠI làm đường lùi, KHÔNG chạy mặc định nữa — Airflow đã thay chỗ này.
  #
  # Nằm trong profile `legacy` nên `docker compose up -d` không đụng tới. Chạy cả
  # hai cùng lúc là tự nhân đôi tốc độ gõ cửa site: chúng dùng chung sổ ngân sách
  # SQLite và mỗi bên đều tưởng mình còn đủ 150 request.
  #
  #     docker compose --profile legacy up -d scheduler     (quay về bản cũ)
  scheduler:
    <<: *app
    profiles: ["legacy"]
    container_name: perfume-intel-scheduler
    entrypoint: ["bash", "scripts/docker/scheduler.sh"]
    restart: unless-stopped
    # Script tự thoát khi nhận SIGTERM nên không cần chờ lâu; nhưng nếu đang
    # giữa một lượt crawl thì cho nó ít giây để đóng browser cho gọn.
    stop_grace_period: 30s
    depends_on:
      minio:
        condition: service_healthy
    environment:
      <<: *lake-env
      # Giờ trong container phải là giờ bạn nghĩ, không thì "02:30" là 02:30 UTC
      # tức 09:30 sáng ở VN — giờ máy đang được dùng.
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      RUN_AT: ${RUN_AT:-02:30}
      # 1 = chạy một lượt ngay khi container bật, để kiểm chứng luôn thay vì
      # chờ tới hôm sau mới biết có hoạt động không.
      RUN_ON_START: ${RUN_ON_START:-0}
      RENDER: ${RENDER:-1}
      BUDGET: ${BUDGET:-}
      BRANDS: ${BRANDS:-}
      DELAY: ${DELAY:-}

  # --- chạy tay một lệnh bất kỳ -----------------------------------------------
  #   docker compose run --rm cli queue
  #   docker compose run --rm cli daily --render --budget 20
  #   docker compose run --rm cli analyze
  cli:
    <<: *app
    profiles: ["cli"]
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      <<: [*lake-env, *ai-env]
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # --- dựng bảng gold bằng dbt ------------------------------------------------
  #   docker compose run --rm marts            (mặc định: build = chạy + test)
  #   docker compose run --rm marts run        (chỉ dựng, bỏ test)
  #   docker compose run --rm marts test
  # Cần `silver` chạy trước, vì dbt đọc Parquet chứ không đọc JSONL thô — và
  # `scripts/marts.sh` chốt đúng chuyện đó trước khi gọi dbt (data/silver là bind
  # mount từ host nên có thể cũ hơn code trong ảnh).
  marts:
    <<: *app
    profiles: ["cli"]
    working_dir: /app/transform
    entrypoint: ["sh", "/app/scripts/marts.sh"]
    command: ["build"]
    environment:
      # dbt đọc YAML bằng encoding mặc định của hệ điều hành; thiếu dòng này thì
      # nó chết ngay ở dòng tiếng Việt đầu tiên trong dbt_project.yml.
      PYTHONUTF8: "1"
      DBT_PROFILES_DIR: "."
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # dbt đọc Parquet trong ./data/silver (cache local), không đọc S3. Vẫn khai
      # biến lake để `silver` chạy trong service này kéo được bản mới về.
      <<: *lake-env

  # --- Airflow: điều phối -----------------------------------------------------
  # MỘT container (standalone). Lần đầu chạy `make airflow-init` để tạo database
  # `airflow` trong Postgres; start.sh lo migrate + tài khoản admin mỗi lần bật.

  # Tạo database `airflow` trong Postgres đang có. Script trong
  # /docker-entrypoint-initdb.d chỉ chạy ở lần khởi tạo ĐẦU TIÊN của volume, mà
  # volume này đã tồn tại từ trước — nên phải tạo bằng một lượt riêng.
  airflow-db:
    image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${PG_PASSWORD:-perfume-dev-only}
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -euo pipefail
        # KHÔNG dùng `\gexec`: đó là lệnh meta của psql, chỉ chạy qua stdin chứ
        # không chạy với `-c`. Viết kiểu đó thì psql báo lỗi cú pháp, database
        # không được tạo, mà script vẫn in "xong" và exit 0 — thành công giả.
        if psql -h postgres -U "${PG_USER:-perfume}" -d "${PG_DB:-perfume}"                -tAc "SELECT 1 FROM pg_database WHERE datname='airflow'" | grep -q 1
        then
          echo "database airflow: da co"
        else
          createdb -h postgres -U "${PG_USER:-perfume}" airflow
          echo "database airflow: vua tao"
        fi
    restart: "no"

  airflow:
    build:
      context: ./scripts/airflow
    image: perfume-intel-airflow:3.3.2
    container_name: perfume-intel-airflow
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # CHỈ 127.0.0.1, không phải 0.0.0.0.
      #
      # Socket Docker được mount vào container này, nên ai đăng nhập được UI là
      # có quyền ngang root trên máy host. Mặc định của Docker là bind mọi giao
      # diện — tức là cả máy khác trong LAN cũng tới được, với mật khẩu mặc định
      # `airflow/airflow`. Muốn mở ra ngoài thì đổi mật khẩu TRƯỚC, rồi sửa dòng
      # này một cách có ý thức.
      #
      # 8082 chứ không phải 8080 (API chatbot) hay 8081 (project tiki-elt chiếm).
      - "127.0.0.1:${AIRFLOW_PORT:-8082}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags:ro
      # `scripts/` để đọc log task bằng dòng lệnh (`make airflow-log`). Log nằm
      # trong named volume nên chỉ container Airflow thấy được.
      - ./scripts:/opt/airflow/scripts:ro
      - airflow-logs:/opt/airflow/logs
      # Socket Docker: Airflow chạy task bằng cách bật container từ ảnh của
      # project. Đây là quyền ngang root trên máy host — chấp nhận được cho một
      # bộ điều phối chạy local, KHÔNG chấp nhận được nếu mở cổng 8081 ra ngoài.
      - /var/run/docker.sock:/var/run/docker.sock
    # 9router chạy trên host. Trên Docker Desktop thì `host.docker.internal` có
    # sẵn; trên Docker Engine Linux phải khai thêm, nên để sẵn cho cả hai.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      # KHÔNG khai AUTH_MANAGER: `airflow standalone` ghi đè cứng nó thành
      # SimpleAuthManager (os.environ[...] ngay trong standalone_command.py), nên
      # khai FAB ở đây chỉ là một dòng nói sai sự thật. Xem scripts/airflow/start.sh.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: ${AIRFLOW_ADMIN_USER:-airflow}:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
      # Worker của LocalExecutor gọi về execution API. Trong bản 4 container đây
      # là http://airflow-apiserver:8080/execution/; gộp lại một container thì
      # phải là localhost. THIẾU DÒNG NÀY thì task đổ với `httpcore.ConnectError:
      # [Errno 111] Connection refused`, mà container vẫn "healthy" vì
      # healthcheck chỉ hỏi api-server còn sống hay không.
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: "http://localhost:8080/execution/"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${PG_USER:-perfume}:${PG_PASSWORD:-perfume-dev-only}@postgres:5432/airflow
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-doi-chuoi-nay-truoc-khi-mo-ra-ngoai}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      # Tắt DAG mẫu: 50 DAG ví dụ làm UI không đọc được và làm scheduler bận vô ích.
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # DAG mới KHÔNG tự chạy. Bật tay sau khi đã đọc — nhất là DAG crawl, thứ
      # chạm mạng thật.
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__CORE__DEFAULT_TIMEZONE: ${TZ:-Asia/Ho_Chi_Minh}
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
      # Để `from _chung import lenh` chắc chắn chạy. Airflow tự thêm thư mục DAG
      # vào sys.path khi nạp DAG, nhưng mọi công cụ khác (DagBag gọi tay, script
      # kiểm) thì không — và lúc đó DAG "biến mất" kèm một ModuleNotFoundError ở
      # chỗ không ai nhìn.
      PYTHONPATH: /opt/airflow/dags
      # Tài khoản đăng nhập, tất định qua start.sh.
      #
      # Tên biến phải TRÙNG KHỚP với tên `scripts/airflow/start.sh` đọc. Trước đây
      # chỗ này khai `AIRFLOW_USER`/`AIRFLOW_PASSWORD` rồi map sang
      # `AIRFLOW_ADMIN_*` — ba tên cho một thứ, và `.env.example` ghi tên thứ ba.
      # Hậu quả: đặt `AIRFLOW_PASSWORD` trong .env thì không có tác dụng gì, còn
      # `AIRFLOW_ADMIN_EMAIL` thì start.sh đọc mà compose không truyền nên nó
      # không bao giờ tới được container.
      AIRFLOW_ADMIN_USER: ${AIRFLOW_ADMIN_USER:-airflow}
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-airflow}
      # --- biến cho DAG (xem airflow/dags/_chung.py) ---
      # Đường dẫn trên MÁY HOST: daemon Docker phân giải mount theo đường dẫn
      # host, không theo đường dẫn bên trong container Airflow.
      HOST_PROJECT_DIR: ${HOST_PROJECT_DIR:?Can dat HOST_PROJECT_DIR trong .env - duong dan project tren may host}
      PERFUME_IMAGE: ${PERFUME_IMAGE:-perfume-intel:0.2.0}
      COMPOSE_NETWORK: ${COMPOSE_NETWORK:-perfume-intel_default}
      RUN_AT: ${RUN_AT:-18:00}
      LAKE: ${LAKE:-s3}
      PERFUME_S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-perfume}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-perfume-dev-only}
      BRONZE_BUCKET: ${BRONZE_BUCKET:-bronze}
      SILVER_BUCKET: ${SILVER_BUCKET:-silver}
      PERFUME_PG_DSN: postgresql://${PG_USER:-perfume}:${PG_PASSWORD:-perfume-dev-only}@postgres:5432/${PG_DB:-perfume}
      EMBED_MODEL: ${EMBED_MODEL:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      timeout: 30s
      retries: 6
      start_period: 120s

  # --- API + trang test chatbot -----------------------------------------------
  #   docker compose up -d api   ->  http://localhost:8000
  #
  # KHÔNG nằm trong profile `cli`: đây là service chạy nền như `scheduler`, và
  # `docker compose up` nên bật nó lên cùng.
  api:
    <<: *app
    container_name: perfume-intel-api
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    entrypoint: ["python", "-m", "uvicorn"]
    command: ["perfume_intel.api.app:create_app", "--factory",
              "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      <<: [*lake-env, *ai-env]
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    # 9router chạy trên host. Trên Docker Desktop thì `host.docker.internal` có
    # sẵn; trên Docker Engine Linux thì phải khai thêm dòng dưới, nên để sẵn cho
    # cả hai chạy được mà không phải sửa file.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

  # --- toàn bộ test, không cần mạng -------------------------------------------
  #   docker compose run --rm test
  test:
    <<: *app
    profiles: ["cli"]
    entrypoint: ["make"]
    command: ["test"]
    # Test chạy trên fixture đã đóng vào ảnh; không cho nó thấy dữ liệu thật để
    # một bài test viết sai đường dẫn không thể làm hỏng sổ theo dõi.
    volumes: []
    environment:
      # LAKE=off có chủ đích, và KHÔNG kế thừa *lake-env: một bài test viết sai
      # đường dẫn không được phép ghi vào kho dữ liệu chính thức. Phần hợp đồng
      # S3 tự bỏ qua khi không thấy S3_ENDPOINT.
      LAKE: "off"
      TZ: ${TZ:-Asia/Ho_Chi_Minh}

volumes:
  # Log của Airflow. Dựng lại được, không cần sao lưu.
  airflow-logs:

  # Kho vector. Dựng lại được từ Parquet nên không cần sao lưu.
  pg-data:

  # Dữ liệu nội bộ của MinIO. Không sửa tay; muốn xem dữ liệu thì mở console ở
  # http://localhost:9001, muốn lấy ra thì `docker compose run --rm cli lake pull`.
  minio-data:
