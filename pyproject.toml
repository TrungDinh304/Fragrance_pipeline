[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perfume-intel"
version = "0.2.0"
description = "Crawl dữ liệu nước hoa và phân tích thị trường từ tín hiệu cộng đồng"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
]

[project.optional-dependencies]
# Chỉ cần cho `--render` (lấy when-to-wear, độ lưu hương, độ toả hương).
# Sau khi cài chạy thêm: python -m playwright install chromium
render = ["playwright>=1.40"]
# Tầng silver (Parquet) + hỏi bằng SQL. duckdb là một wheel ~22 MB và KHÔNG kéo
# theo gói nào khác — không cần pandas/pyarrow.
warehouse = ["duckdb>=1.0"]
# Tầng gold/marts bằng dbt. Nặng hơn hẳn: ~35 gói. Chỉ cài khi thật sự muốn
# dựng marts bằng SQL có kiểm thử; tầng silver ở trên đã trả lời được phần lớn
# câu hỏi mà không cần tới nó.
marts = ["dbt-duckdb>=1.9", "duckdb>=1.0"]
# Data lake trên MinIO/S3. boto3 (~15 MB với botocore) là client CHUẨN của S3 API,
# nên cùng đoạn code chạy với MinIO tự host và với AWS/R2/Wasabi — chỉ đổi biến
# môi trường. Cố ý không dùng SDK riêng của MinIO: một dòng `import minio` sẽ neo
# project vào một nhà cung cấp ở ngay tầng thấp nhất.
lake = ["boto3>=1.34"]
dev = ["pytest>=8.0"]

[project.scripts]
perfume-intel = "perfume_intel.cli.app:main"

[tool.setuptools.packages.find]
include = ["perfume_intel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
