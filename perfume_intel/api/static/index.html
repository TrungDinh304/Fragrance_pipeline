<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>perfume-intel — thử chatbot</title>
<style>
  :root {
    --nen: #faf9f7; --the: #ffffff; --vien: #e5e0d8;
    --chu: #1c1a17; --chu-nhat: #6b6459; --chu-mo: #9a9287;
    --nhan: #8a6a3b; --nhan-nhat: #f2ece1;
    --khach: #efe8da; --do: #a8432c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --nen: #16150f; --the: #1f1d17; --vien: #342f25;
      --chu: #f0ece4; --chu-nhat: #b3aa9c; --chu-mo: #807867;
      --nhan: #d8b277; --nhan-nhat: #2a2418; --khach: #2e2819;
      --do: #e08a72;
    }
  }
  :root[data-theme="dark"] {
    --nen: #16150f; --the: #1f1d17; --vien: #342f25;
    --chu: #f0ece4; --chu-nhat: #b3aa9c; --chu-mo: #807867;
    --nhan: #d8b277; --nhan-nhat: #2a2418; --khach: #2e2819;
    --do: #e08a72;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--nen); color: var(--chu);
    font: 15px/1.6 ui-sans-serif, system-ui, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 16px; border-bottom: 1px solid var(--vien);
    background: var(--the); position: sticky; top: 0; z-index: 5;
  }
  .bao { max-width: 880px; margin: 0 auto; width: 100%; }
  header .bao { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
  .chip {
    font-size: 11.5px; color: var(--chu-nhat); background: var(--nen);
    border: 1px solid var(--vien); border-radius: 999px; padding: 3px 10px;
  }
  .chip b { color: var(--chu); font-weight: 600; }
  .chip.canh { border-color: var(--do); color: var(--do); }
  .lam-moi {
    margin-left: auto; font: inherit; font-size: 12.5px; cursor: pointer;
    background: transparent; color: var(--chu-nhat);
    border: 1px solid var(--vien); border-radius: 8px; padding: 5px 12px;
  }

  main { flex: 1; overflow-y: auto; padding: 20px 16px 8px; }
  .luot { margin-bottom: 20px; }
  .bong {
    padding: 11px 15px; border-radius: 14px; white-space: pre-wrap;
    max-width: 85%; width: fit-content;
  }
  .khach .bong {
    background: var(--khach); margin-left: auto; border-bottom-right-radius: 5px;
  }
  .bot .bong {
    background: var(--the); border: 1px solid var(--vien);
    border-bottom-left-radius: 5px;
  }
  .nhan-vai {
    font-size: 11px; text-transform: uppercase; letter-spacing: .07em;
    color: var(--chu-mo); margin-bottom: 5px; font-weight: 600;
  }
  .khach .nhan-vai { text-align: right; }

  details.du-lieu { margin-top: 8px; max-width: 85%; }
  details.du-lieu > summary {
    cursor: pointer; font-size: 12px; color: var(--chu-mo);
    padding: 4px 0; list-style: none;
  }
  details.du-lieu > summary::marker { content: ""; }
  details.du-lieu > summary::before { content: "▸ "; }
  details.du-lieu[open] > summary::before { content: "▾ "; }
  details.du-lieu > summary:hover { color: var(--nhan); }
  ol {
    margin: 4px 0 0; padding: 10px 14px; list-style: none; counter-reset: x;
    background: var(--the); border: 1px solid var(--vien); border-radius: 10px;
  }
  ol li {
    counter-increment: x; padding: 8px 0 8px 28px; position: relative;
    border-top: 1px solid var(--vien);
  }
  ol li:first-child { border-top: 0; padding-top: 2px; }
  ol li::before {
    content: counter(x); position: absolute; left: 0; top: 8px;
    width: 19px; height: 19px; border-radius: 50%; font-size: 10.5px;
    display: grid; place-items: center; font-weight: 600;
    background: var(--nhan-nhat); color: var(--nhan);
  }
  ol li:first-child::before { top: 2px; }
  .ten { font-weight: 600; font-size: 14px; }
  .ten a { color: inherit; text-decoration: none;
           border-bottom: 1px solid var(--vien); }
  .hang { color: var(--chu-nhat); font-size: 12px; margin-top: 1px; }
  .vi { color: var(--chu-mo); font-size: 11.5px; margin-top: 2px; }
  .y-dinh { font-size: 11.5px; color: var(--chu-mo); margin-top: 6px; }
  .y-dinh code {
    background: var(--nhan-nhat); color: var(--nhan); padding: 1px 5px;
    border-radius: 4px;
  }
  .nghi {
    margin-top: 8px; padding: 8px 12px; border-radius: 8px; max-width: 85%;
    background: var(--nhan-nhat); border-left: 3px solid var(--do);
    color: var(--do); font-size: 12.5px;
  }
  .goi-y { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 0; }
  .goi-y button {
    background: transparent; color: var(--chu-nhat); font: inherit;
    font-size: 12.5px; border: 1px solid var(--vien); padding: 5px 11px;
    border-radius: 999px; cursor: pointer;
  }
  .goi-y button:hover { border-color: var(--nhan); color: var(--nhan); }

  footer {
    border-top: 1px solid var(--vien); background: var(--the);
    padding: 12px 16px 14px; position: sticky; bottom: 0;
  }
  footer form { display: flex; gap: 8px; }
  input[type=text] {
    flex: 1; padding: 11px 14px; font: inherit; color: var(--chu);
    background: var(--nen); border: 1px solid var(--vien); border-radius: 10px;
  }
  input[type=text]:focus { outline: 2px solid var(--nhan); outline-offset: -1px; }
  button.gui {
    padding: 11px 20px; font: inherit; font-weight: 600; cursor: pointer;
    background: var(--nhan); color: #fff; border: 0; border-radius: 10px;
  }
  button.gui:disabled { opacity: .5; cursor: progress; }
  /* Ẩn bằng mắt nhưng trình đọc màn hình vẫn đọc được. `display:none` thì nó
     cũng bị bỏ, nên dùng cách cắt khỏi khung hình. */
  .an {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
  .chan-ghi-chu { font-size: 11px; color: var(--chu-mo); margin-top: 7px; }
</style>
</head>
<body>
<header>
  <div class="bao">
    <h1>perfume-intel</h1>
    <span class="chip" id="chip-retriever">đang nối…</span>
    <span class="chip" id="chip-llm"></span>
    <button class="lam-moi" id="lam-moi">Hội thoại mới</button>
  </div>
</header>

<main id="khung"><div class="bao" id="dong-chat"></div></main>

<footer>
  <div class="bao">
    <form id="form">
      <label for="cau" class="an">Câu hỏi của bạn</label>
      <input type="text" id="cau" autocomplete="off"
             placeholder="Hỏi bằng tiếng Việt — ví dụ: mùi gỗ ấm cho buổi tối mùa đông">
      <button class="gui" id="gui">Gửi</button>
    </form>
    <div class="goi-y" id="goi-y"></div>
    <div class="chan-ghi-chu" id="chan"></div>
  </div>
</footer>

<script>
const MO_DAU = [
  "mùi gỗ ấm cho buổi tối mùa đông",
  "nước hoa tươi mát đi biển mùa hè",
  "mui hoa nhe nhang cho nu",
];
// Gợi ý sau khi đã có một lượt — đây mới là chỗ thử phần hội thoại.
const NOI_TIEP = [
  "nhẹ hơn chút được không",
  "còn gì nữa không",
  "chai thứ 2 thì sao",
  "mùa hè thì sao",
  "cho nữ thì sao",
];

const $ = (id) => document.getElementById(id);
let phien = null;
let soLuot = 0;

function chip(o, nhan, gt, canh) {
  o.className = "chip" + (canh ? " canh" : "");
  o.innerHTML = gt ? nhan + " <b>" + gt + "</b>" : nhan;
}

async function napTrangThai() {
  try {
    const d = await (await fetch("/health")).json();
    chip($("chip-retriever"), "", d.retriever + " · " + d.perfumes + " chai");
    if (d.llm.configured) chip($("chip-llm"), "model", d.llm.model);
    else chip($("chip-llm"), "chưa có khoá model — câu trả lời ghép sẵn", "", true);
    $("chan").textContent = "lake: " + d.lake;
  } catch (e) {
    chip($("chip-retriever"), "API không gọi được: " + e.message, "", true);
  }
}

function veGoiY() {
  const o = $("goi-y");
  o.innerHTML = "";
  for (const v of (soLuot === 0 ? MO_DAU : NOI_TIEP)) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = v;
    b.onclick = () => hoi(v);
    o.append(b);
  }
}

function themBong(vai, chu) {
  const l = document.createElement("div");
  l.className = "luot " + (vai === "khach" ? "khach" : "bot");
  const n = document.createElement("div");
  n.className = "nhan-vai"; n.textContent = vai === "khach" ? "Bạn" : "Tư vấn";
  const b = document.createElement("div");
  b.className = "bong"; b.textContent = chu;
  l.append(n, b);
  $("dong-chat").append(l);
  $("khung").scrollTop = $("khung").scrollHeight;
  return l;
}

function veDuLieu(l, d) {
  const ms = d.matches || [];
  const co = (d.seed ? 1 : 0) + ms.length;
  if (!co) return;
  const det = document.createElement("details");
  det.className = "du-lieu";
  // Mở sẵn: nguyên tắc là người đọc đối chiếu được câu trả lời với dữ liệu gốc,
  // nên không bắt họ bấm thêm một lần mới thấy.
  det.open = true;
  const sm = document.createElement("summary");
  sm.textContent = "dữ liệu retriever trả về (" + co + ")";
  det.append(sm);

  const ol = document.createElement("ol");
  const ds = d.seed ? [d.seed, ...ms] : ms;
  for (const m of ds) {
    const li = document.createElement("li");
    const ten = document.createElement("div");
    ten.className = "ten";
    if (m.url) {
      const a = document.createElement("a");
      a.href = m.url; a.target = "_blank"; a.rel = "noopener";
      a.textContent = m.name || "(không tên)";
      ten.append(a);
    } else ten.textContent = m.name || "(không tên)";
    li.append(ten);
    const p = [];
    if (m.brand) p.push(m.brand);
    if (m.rating != null) p.push(m.rating.toFixed(2) + "★");
    if (m.rating_count) p.push(m.rating_count.toLocaleString("vi-VN") + " lượt");
    if (m.gender) p.push(m.gender);
    const h = document.createElement("div");
    h.className = "hang"; h.textContent = p.join(" · ");
    li.append(h);
    if (m.why && m.why.length) {
      const v = document.createElement("div");
      v.className = "vi";
      v.textContent = "vì: " + m.why.map((w) => w.block + " " + w.label).join(", ");
      li.append(v);
    }
    ol.append(li);
  }
  det.append(ol);

  const yd = [];
  const them = (nhan, gt) => {
    if (gt && gt.length) yd.push(nhan + ": " + [].concat(gt)
      .map((x) => "<code>" + x + "</code>").join(" "));
  };
  yd.push("lượt: <code>" + d.action + "</code>");
  them("note", d.intent.notes);
  them("accord", d.intent.accords);
  them("dịp", d.intent.occasions);
  if (d.intent.gender) them("giới tính", [d.intent.gender]);
  if (d.unknown && d.unknown.length) them("không hiểu", d.unknown);
  if (d.exhausted) yd.push("<i>đã hết chai mới cho điều kiện này</i>");
  if (!d.llm) yd.push("<i>chưa có khoá model</i>");
  const o = document.createElement("div");
  o.className = "y-dinh"; o.innerHTML = yd.join(" · ");
  det.append(o);
  l.append(det);

  if (d.suspicious && d.suspicious.length) {
    const c = document.createElement("div");
    c.className = "nghi";
    c.innerHTML = "Câu trả lời nhắc tên không có trong dữ liệu: <b>"
      + d.suspicious.join(", ") + "</b> — hãy đối chiếu danh sách trên.";
    l.append(c);
  }
  $("khung").scrollTop = $("khung").scrollHeight;
}

async function hoi(cau) {
  if (!cau) return;
  $("cau").value = "";
  $("gui").disabled = true;
  themBong("khach", cau);
  const cho = themBong("bot", "…");
  try {
    const r = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: cau, limit: 5, session_id: phien }),
    });
    if (!r.ok) throw new Error("HTTP " + r.status + " " + (await r.text()).slice(0, 180));
    const d = await r.json();
    phien = d.session_id;
    soLuot = d.turn || soLuot + 1;
    cho.querySelector(".bong").textContent = d.answer;
    veDuLieu(cho, d);
    veGoiY();
  } catch (e) {
    const b = cho.querySelector(".bong");
    b.textContent = "Lỗi: " + e.message;
    b.style.color = "var(--do)";
  } finally {
    $("gui").disabled = false;
    $("cau").focus();
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  hoi($("cau").value.trim());
});

$("lam-moi").addEventListener("click", async () => {
  if (phien) {
    try {
      await fetch("/chat/reset", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session_id: phien }),
      });
    } catch (e) { /* phiên mất rồi cũng không sao */ }
  }
  phien = null; soLuot = 0;
  $("dong-chat").innerHTML = "";
  veGoiY();
  $("cau").focus();
});

napTrangThai();
veGoiY();
$("cau").focus();
</script>
</body>
</html>
